# ==============================================================================
# Secret Santa — Self-Hosted Docker Compose Configuration (NAS / Home Server)
# Usage:
#   1. cp .env.example .env && edit .env
#   2. docker compose up -d
# ==============================================================================
services:
  secret-santa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secret-santa
    restart: unless-stopped
    # Expose HTTP port to local reverse proxy (Nginx)
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    # Load environment configuration (APP_BASE_URL, SUPER_ADMIN_*, SMTP_*)
    env_file:
      - .env
    environment:
      # Literal on purpose: .env must never switch compose to development mode
      - APP_ENV=production
      - DB_PATH=/data/secret-santa.db
    # Let in-flight draw emails finish (app shutdown budget is 100s)
    stop_grace_period: 2m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # CHOWN/SETUID/SETGID are needed by the su-exec entrypoint
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 256m
    pids_limit: 100
    # Mount persistent NAS folder to /data so SQLite DB + WAL survive restarts/updates
    volumes:
      - ./data:/data

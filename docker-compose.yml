services:
  secret-santa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secret-santa
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - DB_PATH=/data/secret-santa.db
    volumes:
      - ./data:/data
